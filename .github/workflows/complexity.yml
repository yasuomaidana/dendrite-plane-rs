# Second opinion on function complexity, using the standard tool of each language.
# Our own implementation (dendrite-core, run by `dendrite allostasis gate` and loom-gate) stays the first check; this
# workflow runs the language tools as an independent cross-check. Limits come from [complexity] in
# .github/dendrite/directives.toml (defaults: cyclomatic 10, cognitive 15).
name: complexity (second opinion)
on:
  push:
    branches: [develop, main]
  pull_request:
jobs:
  rust:
    name: Rust (clippy cognitive_complexity, lizard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Limits from the project directives
        id: limits
        run: |
          f=.github/dendrite/directives.toml
          pick() { awk -v key="$1" '/^\[complexity\]/{t=1;next} /^\[/{t=0} t && $1==key {print $3; exit}' "$f" 2>/dev/null || true; }
          cyc=$(pick max_cyclomatic); cog=$(pick max_cognitive)
          echo "cyc=${cyc:-10}" >> "$GITHUB_OUTPUT"
          echo "cog=${cog:-15}" >> "$GITHUB_OUTPUT"
      - name: Clippy configuration with the cognitive limit
        run: |
          mkdir -p "$RUNNER_TEMP/clippy"
          echo "cognitive-complexity-threshold = ${{ steps.limits.outputs.cog }}" > "$RUNNER_TEMP/clippy/clippy.toml"
      - name: clippy cognitive_complexity (report only, known debt DPLANE-11)
        env:
          CLIPPY_CONF_DIR: ${{ runner.temp }}/clippy
        run: |
          out=$(cargo clippy --workspace --all-targets -- -A clippy::all -D clippy::cognitive_complexity 2>&1) && rc=0 || rc=$?
          n=$(printf '%s\n' "$out" | grep -c "cognitive complexity of" || true)
          if [ "$rc" -ne 0 ] && [ "$n" -eq 0 ]; then printf '%s\n' "$out" | tail -30; echo "::error title=clippy::clippy did not run to completion (exit $rc)"; exit 1; fi
          echo "::warning title=clippy cognitive_complexity::$n functions above the cognitive limit (known debt, DPLANE-11); this step turns blocking when the debt is cleared"
          echo "clippy cognitive_complexity: $n functions above the limit" >> "$GITHUB_STEP_SUMMARY"
      - name: lizard (cyclomatic, report only until the first run is compared with loom-gate, see DPLANE-11)
        run: |
          python3 -m pip install --quiet lizard==1.17.10
          out=$(python3 -m lizard -l rust -C "${{ steps.limits.outputs.cyc }}" -w -x "*/target/*" . 2>&1) && rc=0 || rc=$?
          n=$(printf '%s\n' "$out" | grep -c "warning:" || true)
          if [ "$rc" -ne 0 ] && [ "$n" -eq 0 ]; then printf '%s\n' "$out" | tail -30; echo "::error title=lizard::lizard did not run (exit $rc)"; exit 1; fi
          echo "::warning title=lizard::$n Rust functions above the cyclomatic limit; compare with loom-gate complexity and make this step blocking"
          echo "lizard: $n Rust functions above the cyclomatic limit" >> "$GITHUB_STEP_SUMMARY"
